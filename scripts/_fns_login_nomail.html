  content: "+";
  position: absolute;

  top: 50%;
  transform: translateY(-50%);
  font-weight: 700;

		 document.getElementById('th_channel').innerHTML = '<p class="load">Cargando...</p>';

	 {

 }

 function cambia_quincena( sentido )
 {
	 var mes_inicio = document.form_fechas.mes_inicio.value;
	 var ano_inicio = document.form_fechas.ano_inicio.value;	
	 
	 if( sentido == "subir" )
	 {
		 if( document.form_fechas.quincena_inicio.value == "1" )
		 {
			 document.form_fechas.quincena_inicio.value = "2";
		 }
		 else
		 {
			 document.form_fechas.quincena_inicio.value = "1";

			 if( mes_inicio == 12 )
			 {
				 document.form_fechas.mes_inicio.value = 1;
				 document.form_fechas.ano_inicio.value = parseInt(ano_inicio) + 1;
			 }
			 else
			 {
				 document.form_fechas.mes_inicio.value = parseInt(mes_inicio) + 1;
			 }
		 }
	 }

	/*

	si el importye tiene algo que no sea , o . o numero devuelve vacio
	devuelve el importe redondeado segun los decimales de la moneda
	*/
	function controlar_decimales( id_input_importe, moneda_id, id_select_moneda="" ){
		let numeroDecimales=0;
		let select_moneda;
		let input_importe = $("#" + id_input_importe);
		let importe = input_importe.val();
		
		importe = importe.replace(",",".");
		const regexpString = /[^0-9\.]*/;
		var reg = new RegExp(/^[0-9\.]+$/);

		//comprobamos que tenga solo un umero o numero con . y decimales
		if(reg.test(importe)){
			importe = importe.replace(regexpString,"");
    		if(id_select_moneda!=""){
    			select_moneda = $("#" + id_select_moneda);
        		if(select_moneda.length){
        			if(select_moneda.val()!=""){
        				moneda_id = select_moneda.val();
        			}
        		}
    		}
		}else{
			//si tiene algo que no sea numero o . devolvemos vacio
			input.value="";
			return;
		}
    	if(importe=='undefined' || importe==""){
    		return;
    	}
    	if(moneda_id==1 || moneda_id==2 || moneda_id==3 || moneda_id==6 || moneda_id==8 || moneda_id==11){
    		numeroDecimales=2;
    	}else{
    		numeroDecimales=0;
    	}	
    	importe = number_format(importe, numeroDecimales, ".", "");
    	input_importe.val(importe);
    	
    }
    
    function number_format (number, decimals, dec_point, thousands_sep) {
        // Strip all characters but numerical ones.
        number = (number + '').replace(/[^0-9+\-Ee.]/g, '');
        var n = !isFinite(+number) ? 0 : +number,
            prec = !isFinite(+decimals) ? 0 : Math.abs(decimals),
            sep = (typeof thousands_sep === 'undefined') ? ',' : thousands_sep,
            dec = (typeof dec_point === 'undefined') ? '.' : dec_point,
            s = '',
            toFixedFix = function (n, prec) {
                var k = Math.pow(10, prec);
                return '' + Math.round(n * k) / k;
            };
        // Fix for IE parseFloat(0.55).toFixed(0) = 0;
        s = (prec ? toFixedFix(n, prec) : '' + Math.round(n)).split('.');
        if (s[0].length > 3) {
            s[0] = s[0].replace(/\B(?=(?:\d{3})+(?!\d))/g, sep);
        }
        if ((s[1] || '').length < prec) {
            s[1] = s[1] || '';
            s[1] += new Array(prec - s[1].length + 1).join('0');
        }
        return s.join(dec);
    }
